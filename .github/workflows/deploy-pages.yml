name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      refresh_event_id:
        description: 'ID del tema de Discourse que se debe releer'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # El cron corre cada 15 minutos y no debe cancelar un deploy manual o por push.
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      digest: ${{ steps.detect.outputs.digest }}
      refresh_ids: ${{ steps.detect.outputs.refresh_ids }}
      recent_post_state: ${{ steps.detect.outputs.recent_post_state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # El detector usa esta caché solo para comparar el updated_at guardado
      # con una muestra acotada de primeros posts. No reconstruye los eventos.
      - name: Restore events data cache for edit detection
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: events-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            events-data-${{ runner.os }}-

      - name: Restore previous signature state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .ci-state
          key: events-signature-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            events-signature-${{ runner.os }}-

      - name: Detect event changes
        id: detect
        run: node scripts/check-events-signature.mjs

      - name: Upload category topics snapshot
        if: github.event_name != 'schedule' || steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: category-topics-${{ github.run_id }}
          path: .ci-state/category-topics.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  build:
    needs: detect-changes
    if: github.event_name != 'schedule' || needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore events data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: events-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            events-data-${{ runner.os }}-

      - name: Download category topics snapshot
        uses: actions/download-artifact@v4
        with:
          name: category-topics-${{ github.run_id }}
          path: .ci-state

      - name: Snapshot restored cache index
        run: |
          mkdir -p .ci-state
          if [ -f cache/index.json ]; then
            cp cache/index.json .ci-state/cache-index-before.json
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          EVENT_REFRESH_IDS: "${{ inputs.refresh_event_id }} ${{ needs.detect-changes.outputs.refresh_ids }}"
          EVENT_TOPICS_SNAPSHOT: .ci-state/category-topics.json
        run: npm run build

      - name: Validate cache health
        run: node scripts/check-cache-health.mjs .ci-state/cache-index-before.json cache/index.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Save events data cache
        uses: actions/cache/save@v4
        with:
          path: cache
          key: events-data-${{ runner.os }}-${{ github.run_id }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm deployed signature state
        env:
          RECENT_POST_STATE: ${{ needs.detect-changes.outputs.recent_post_state }}
        run: |
          mkdir -p .ci-state
          printf '%s\n' '${{ needs.detect-changes.outputs.digest }}' > .ci-state/events-signature.txt
          if [ -n "$RECENT_POST_STATE" ]; then
            printf '%s' "$RECENT_POST_STATE" | base64 --decode > .ci-state/recent-post-signatures.json
          fi

      - name: Save deployed signature state
        uses: actions/cache/save@v4
        with:
          path: .ci-state
          key: events-signature-${{ runner.os }}-${{ github.run_id }}
